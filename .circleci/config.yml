# CircleCI 2.1 — builds & deploys the universal tag (apps/tracker) from the Turborepo.
# The monorepo uses Bun (package manager + workspaces) and Turborepo. Parcel runs under
# Node via apps/tracker/scripts/run-parcel.mjs. node_modules is hoisted (bunfig.toml) so
# Parcel's resolver works. Buckets and all CloudFront distribution IDs are unchanged from
# the pre-monorepo pipeline — only the build commands and the dist path (apps/tracker/dist) changed.

version: 2.1

executors:
  the-executor:
    docker:
      - image: cimg/node:22.11.0
    working_directory: ~/mediajel-tracker

orbs:
  aws-cli: circleci/aws-cli@4.0
  aws-s3: circleci/aws-s3@2.0.0
  aws-cloudfront: topmonks/aws-cloudfront@1.0.0

commands:
  install-bun:
    description: Install Bun (pinned) and put it on PATH for later steps
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.8"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
  bun-test:
    description: Run one workspace's bun tests, and run them again if the run stalls
    parameters:
      title:
        type: string
      workspace:
        type: string
    steps:
      - run:
          name: << parameters.title >>
          working_directory: << parameters.workspace >>
          # Bun 1.3 can stall between printing a test file's name and running its first test when
          # the executor's two CPUs are busy (oven-sh/bun#31653): nothing fails and nothing prints,
          # so the job sits out CircleCI's ten-minute silence limit. It has stalled this repo's
          # builds that way on a different file each time — twice in one build, once, even on the
          # first file of the second run. These suites finish in seconds, so a run still going
          # after two minutes is that stall rather than a slow test: it is stopped and run again,
          # up to four times. A failing test fails the step on the first run — only a stall is
          # retried.
          command: |
            for attempt in 1 2 3 4; do
              code=0
              timeout --kill-after=10s 2m bun run test || code=$?
              case "$code" in
                124|137) echo "bun test stalled on attempt $attempt of 4 and was stopped (oven-sh/bun#31653)." ;;
                *) exit "$code" ;;
              esac
            done
            exit 1
  install-and-check:
    description: Install dependencies (hoisted) and type-check the tracker + its packages
    steps:
      - run:
          name: Install project dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Type checking (tracker + shared packages)
          command: bun x turbo run check --filter=mediajel-tracker
      - bun-test:
          title: Unit tests (assistant-core — headless bun test, no Cypress deps)
          workspace: packages/assistant-core
      - run:
          name: Build tag
          command: bun x turbo run build --filter=mediajel-tracker

jobs:
  # The extension is checked and packaged on every branch, which is the first gate this repo has
  # had on a pull request. The .env.production is written from the context the same way the
  # serverless repo writes its own: only PLASMO_PUBLIC_* names reach the extension's code, and an
  # unset one would leave a literal "$NAME/*" in host_permissions that Chrome refuses to load.
  build-extension:
    executor: the-executor
    steps:
      - checkout
      - install-bun
      - run:
          name: Install project dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Write the extension's build configuration
          command: |
            cd apps/extension
            # Two of these have a documented value and a default, so a branch build produces an
            # INSTALLABLE artifact instead of failing for want of something nobody has set yet.
            # The assistant service is external-service in amplication-nestjs-microservices, which
            # serves /api/assistant under its own ingress:
            #   staging     https://external-service.dmp.mediajel.ninja/api/assistant
            #   production  https://external-service.dmp.cnna.io/api/assistant
            # Set PLASMO_PUBLIC_WIDGET_API_URL in this job's context to the one this zip is for.
            # Unset, it falls back to localhost, which is where an engineer testing the zip runs
            # the service anyway. The guard below still fails hard on any OTHER unset
            # PLASMO_PUBLIC_*, because those would leave a literal "$NAME/*" that Chrome refuses.
            echo "PLASMO_PUBLIC_WIDGET_API_URL=${PLASMO_PUBLIC_WIDGET_API_URL:-http://localhost:3011/api/assistant}" >> .env.production
            echo "PLASMO_PUBLIC_COGNITO_USER_POOL_ID=${PLASMO_PUBLIC_COGNITO_USER_POOL_ID}" >> .env.production
            echo "PLASMO_PUBLIC_COGNITO_CLIENT_ID=${PLASMO_PUBLIC_COGNITO_CLIENT_ID}" >> .env.production
            echo "PLASMO_PUBLIC_COGNITO_REGION=${PLASMO_PUBLIC_COGNITO_REGION}" >> .env.production
            echo "PLASMO_PUBLIC_FRICTIONLESS_CUSTOMTAG_URL=${FRICTIONLESS_CUSTOMTAG_URL}" >> .env.production
            echo "PLASMO_PUBLIC_TAG_URL=${PLASMO_PUBLIC_TAG_URL}" >> .env.production
            echo "PLASMO_PUBLIC_TAG_ORIGIN=${PLASMO_PUBLIC_TAG_ORIGIN:-https://tags.cnna.io}" >> .env.production
            echo "CRX_PUBLIC_KEY=${CRX_PUBLIC_KEY}" >> .env.production
      - run:
          name: Type check and lint the extension
          command: bun x turbo run check lint --filter=@mediajel/extension
      - bun-test:
          title: Test the extension
          workspace: apps/extension
      - run:
          name: Build and package the extension
          command: bun x turbo run build --filter=@mediajel/extension
      - run:
          name: Confirm the manifest resolved its configuration
          command: |
            cd apps/extension
            if grep -q '"\$PLASMO_PUBLIC' dist/chrome-mv3-prod/manifest.json; then
              echo "An unset PLASMO_PUBLIC_* left a placeholder in the manifest; Chrome would refuse to load this."
              grep '\$PLASMO_PUBLIC' dist/chrome-mv3-prod/manifest.json
              exit 1
            fi
      # Names only, never values: an unset context variable is not a build error here (the manifest
      # guard above catches the two that break Chrome outright), but a zip that cannot sign in or
      # keeps a different extension id on every install is worth saying out loud rather than
      # discovering after someone has installed it.
      - run:
          name: Which build configuration this context supplied
          command: |
            missing=""
            for name in PLASMO_PUBLIC_COGNITO_USER_POOL_ID PLASMO_PUBLIC_COGNITO_CLIENT_ID \
                        PLASMO_PUBLIC_COGNITO_REGION PLASMO_PUBLIC_TAG_URL \
                        FRICTIONLESS_CUSTOMTAG_URL CRX_PUBLIC_KEY PLASMO_PUBLIC_WIDGET_API_URL; do
              if [ -n "$(eval echo \$$name)" ]; then echo "  set      $name"; else echo "  MISSING  $name"; missing="$missing $name"; fi
            done
            case "$missing" in
              *COGNITO*) echo "Without the Cognito three this zip cannot sign in, so it cannot generate, deploy or read activity." ;;
            esac
            case "$missing" in
              *CRX_PUBLIC_KEY*) echo "Without CRX_PUBLIC_KEY the extension id changes on every reinstall, which orphans saved jobs." ;;
            esac
      - run:
          name: Report the service URL this build points at
          command: |
            cd apps/extension
            url=$(grep '^PLASMO_PUBLIC_WIDGET_API_URL=' .env.production | cut -d= -f2-)
            echo "This zip talks to: $url"
            case "$url" in
              *localhost*)
                echo "That is a local service, so this zip is only usable beside one."
                echo "To point it at the deployed assistant, set PLASMO_PUBLIC_WIDGET_API_URL in this job's context:"
                echo "  staging     https://external-service.dmp.mediajel.ninja/api/assistant"
                echo "  production  https://external-service.dmp.cnna.io/api/assistant" ;;
              *internal-service*)
                echo "WRONG SERVICE: the assistant module lives in external-service, not internal-service."
                exit 1 ;;
            esac
      - store_artifacts:
          path: apps/extension/dist/chrome-mv3-prod.zip
          destination: mediajel-integrations-assistant.zip

  build-staging:
    executor: the-executor
    steps:
      - checkout
      - install-bun
      - install-and-check
        #   TODO: UNCOMMENT LATER
      # - run:
      #     name: Cypress Install
      #     command: sudo apt-get update && sudo apt-get install libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      # - run:
      #     name: cypress tests
      #     command: bun x turbo run test --filter=mediajel-tracker
      - aws-cli/install:
          version: latest
      - run:
          name: Sync to S3
          command: |
            aws s3 sync apps/tracker/dist/ s3://mediajel-tracker-staging
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E1ZEPT1NM5152K --paths "/*"

  build-main:
    executor: the-executor
    steps:
      - checkout
      - install-bun
      - install-and-check
      # - run:
      #     name: Cypress Install
      #     command: sudo apt-get update && sudo apt-get install libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      # - run:
      #     name: cypress tests
      #     command: bun x turbo run test --filter=mediajel-tracker
      - aws-cli/install:
          version: latest
      - run:
          name: Sync to S3
          command: |
            aws s3 sync apps/tracker/dist/ s3://mediajel-tracker-production
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E3NZWAOF5B6J2O --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E3FT67SI37G1ZH --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id EQGTP3X7S8LMI --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id EFJHMMZDNURYT --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E39XLCEMWS6VO1 --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E270PRY60O4B3Y --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id ELFZ8CP0408WK --paths "/*"
      - run:
          name: Run Tracker
          command: bun x turbo run generate-environments --filter=mediajel-tracker

workflows:
  version: 2
  build:
    jobs:
      - build-extension:
          context: STAGING
      - build-staging:
          context: STAGING
          filters:
            branches:
              only: staging
      - build-main:
          context: PRODUCTION
          filters:
            branches:
              only: main
