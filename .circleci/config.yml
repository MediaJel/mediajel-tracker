# CircleCI 2.1 — builds & deploys the universal tag (apps/tracker) from the Turborepo.
# The monorepo uses Bun (package manager + workspaces) and Turborepo. Parcel runs under
# Node via apps/tracker/scripts/run-parcel.mjs. node_modules is hoisted (bunfig.toml) so
# Parcel's resolver works. Buckets and all CloudFront distribution IDs are unchanged from
# the pre-monorepo pipeline — only the build commands and the dist path (apps/tracker/dist) changed.

version: 2.1

executors:
  the-executor:
    docker:
      - image: cimg/node:22.11.0
    working_directory: ~/mediajel-tracker

orbs:
  aws-cli: circleci/aws-cli@4.0
  aws-s3: circleci/aws-s3@2.0.0
  aws-cloudfront: topmonks/aws-cloudfront@1.0.0

commands:
  install-bun:
    description: Install Bun (pinned) and put it on PATH for later steps
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.8"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
  install-and-check:
    description: Install dependencies (hoisted) and type-check the tracker + its packages
    steps:
      - run:
          name: Install project dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Type checking (tracker + shared packages)
          command: bun x turbo run check --filter=mediajel-tracker
      - run:
          name: Build tag
          command: bun x turbo run build --filter=mediajel-tracker

jobs:
  # The only job that proves the tag WORKS rather than that it compiles. A machine executor because
  # it needs Docker on localhost: Micro is configured by two mounted files (the /analytics/track
  # path mapping and the MediaJel Iglu registry), and a secondary container cannot mount volumes.
  # Running the repo's own docker-compose.yml means CI runs exactly what `bun run micro:up` runs.
  e2e-signals:
    machine:
      image: ubuntu-2404:current
    working_directory: ~/mediajel-tracker
    environment:
      # The rig serves the tag, the fixture pages and Micro's API on this one origin, and the tag is
      # built against it so the suite reads what the BUILD baked in. See apps/e2e/README.md.
      COLLECTOR_URL: http://localhost:4330
    steps:
      - checkout
      # CircleCI 2.1 cannot filter on a pull request's TARGET branch, so this is the honest
      # approximation: run whenever a PR exists, and run on staging/main pushes as the deploy gate
      # (where CIRCLE_PULL_REQUEST is empty but the branch filter below has already selected them).
      - run:
          name: Skip unless this is a pull request or a deploy branch
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ] && [ "$CIRCLE_BRANCH" != "staging" ] && [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "No pull request for $CIRCLE_BRANCH; nothing to gate."
              circleci-agent step halt
            fi
      - install-bun
      - run:
          name: Start Snowplow Micro
          command: docker compose up -d snowplow-micro
      - run:
          name: Install project dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Install the browser the suite drives
          command: ./node_modules/.bin/playwright install --with-deps chromium
      - run:
          name: Wait for Snowplow Micro
          command: |
            for i in $(seq 1 60); do
              curl -sf http://localhost:9090/micro/all >/dev/null && echo "micro is up" && exit 0
              sleep 2
            done
            echo "Snowplow Micro never answered on :9090"
            docker compose logs snowplow-micro
            exit 1
      - run:
          name: Build the tag against the test collector
          command: bun x turbo run build --filter=mediajel-tracker
      - run:
          name: End-to-end signal verification
          command: bun x turbo run e2e --filter=@mediajel/e2e
      # A quarantined event carries its own validation error, which is almost always the whole
      # answer. Keep it, and Micro's log, for the failures nobody can reproduce locally.
      - run:
          name: What Snowplow Micro quarantined
          when: on_fail
          command: |
            mkdir -p /tmp/micro
            curl -s http://localhost:9090/micro/all  > /tmp/micro/counts.json || true
            curl -s http://localhost:9090/micro/bad  > /tmp/micro/bad.json || true
            docker compose logs snowplow-micro > /tmp/micro/micro.log 2>&1 || true
      - store_artifacts:
          path: /tmp/micro
          destination: snowplow-micro
      - store_artifacts:
          path: apps/e2e/out
          destination: e2e
      - store_test_results:
          path: apps/e2e/out/results

  build-staging:
    executor: the-executor
    steps:
      - checkout
      - install-bun
      - install-and-check
        #   TODO: UNCOMMENT LATER
      # - run:
      #     name: Cypress Install
      #     command: sudo apt-get update && sudo apt-get install libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      # - run:
      #     name: cypress tests
      #     command: bun x turbo run test --filter=mediajel-tracker
      - aws-cli/install:
          version: latest
      - run:
          name: Sync to S3
          command: |
            aws s3 sync apps/tracker/dist/ s3://mediajel-tracker-staging
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E1ZEPT1NM5152K --paths "/*"

  build-main:
    executor: the-executor
    steps:
      - checkout
      - install-bun
      - install-and-check
      # - run:
      #     name: Cypress Install
      #     command: sudo apt-get update && sudo apt-get install libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      # - run:
      #     name: cypress tests
      #     command: bun x turbo run test --filter=mediajel-tracker
      - aws-cli/install:
          version: latest
      - run:
          name: Sync to S3
          command: |
            aws s3 sync apps/tracker/dist/ s3://mediajel-tracker-production
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E3NZWAOF5B6J2O --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E3FT67SI37G1ZH --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id EQGTP3X7S8LMI --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id EFJHMMZDNURYT --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E39XLCEMWS6VO1 --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id E270PRY60O4B3Y --paths "/*"
      - run:
          name: Invalidate CloudFront
          command: |
            aws cloudfront create-invalidation --distribution-id ELFZ8CP0408WK --paths "/*"
      - run:
          name: Run Tracker
          command: bun x turbo run generate-environments --filter=mediajel-tracker

workflows:
  version: 2
  build:
    jobs:
      - e2e-signals:
          filters:
            branches:
              ignore: []
      - build-staging:
          context: STAGING
          requires:
            - e2e-signals
          filters:
            branches:
              only: staging
      - build-main:
          context: PRODUCTION
          requires:
            - e2e-signals
          filters:
            branches:
              only: main
